<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login | Silk & Soul</title>
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body>
  <div class="login-page">
    <div class="login-card">
      <div class="login-brand">
        <div class="mark">✦</div>
        <h1>Silk & Soul</h1>
        <p>Admin Control Panel</p>
      </div>
      <div class="login-error" id="loginError">Invalid email or password</div>
      <form id="loginForm">
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" value="admin@silkandsoul.com" required autocomplete="username">
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" value="admin123" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn-admin btn-admin-primary btn-block">Sign in to Dashboard</button>
      </form>
      <div class="login-hint">
        First-run admin (created in MongoDB if empty): <strong>admin@silkandsoul.com</strong> / <strong>admin123</strong>
      </div>
      <a href="../index.html" class="login-back">← Back to store</a>
    </div>
  </div>

  <script src="../js/api.js"></script>
  <script>
    if (getToken()) location.href = 'dashboard.html';

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const err = document.getElementById('loginError');
      err.classList.remove('show');
      try {
        const { token, admin } = await AuthAPI.login(email, password);
        setSession(token, admin);
        location.href = 'dashboard.html';
      } catch (ex) {
        err.textContent = ex.message || 'Invalid email or password';
        err.classList.add('show');
      }
    });
  </script>
</body>
</html>
