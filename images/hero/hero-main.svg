<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5A1529"/>
      <stop offset="50%" stop-color="#7B1E3A"/>
      <stop offset="100%" stop-color="#3D0F1F"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B8944A"/>
      <stop offset="50%" stop-color="#F0D78C"/>
      <stop offset="100%" stop-color="#B8944A"/>
    </linearGradient>
    <pattern id="paisley" width="120" height="120" patternUnits="userSpaceOnUse">
      <circle cx="60" cy="60" r="28" fill="none" stroke="#C9A962" stroke-width="1" opacity="0.25"/>
      <path d="M60 20 Q80 40 60 60 Q40 40 60 20" fill="#C9A962" opacity="0.15"/>
      <path d="M20 60 Q40 80 60 60 Q40 40 20 60" fill="#C9A962" opacity="0.12"/>
    </pattern>
    <radialGradient id="glow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#E8D5A3" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#5A1529" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="1000" fill="url(#bg)"/>
  <rect width="800" height="1000" fill="url(#paisley)"/>
  <rect width="800" height="1000" fill="url(#glow)"/>
  <!-- Saree drape shape -->
  <path d="M180 120 Q400 80 620 120 L680 900 Q400 960 120 900 Z" fill="#8B2942" opacity="0.9"/>
  <path d="M220 160 Q400 130 580 160 L620 860 Q400 900 180 860 Z" fill="#9B3050" opacity="0.85"/>
  <!-- Pallu -->
  <path d="M480 160 L620 160 L680 900 L520 860 Z" fill="#6B1830"/>
  <!-- Zari border -->
  <path d="M180 120 Q400 80 620 120" fill="none" stroke="url(#gold)" stroke-width="6"/>
  <path d="M120 900 Q400 960 680 900" fill="none" stroke="url(#gold)" stroke-width="8"/>
  <line x1="480" y1="160" x2="520" y2="860" stroke="url(#gold)" stroke-width="4"/>
  <!-- Motifs -->
  <g fill="#C9A962" opacity="0.6">
    <circle cx="350" cy="350" r="40" fill="none" stroke="#C9A962" stroke-width="2"/>
    <circle cx="350" cy="350" r="20"/>
    <circle cx="350" cy="550" r="30" fill="none" stroke="#C9A962" stroke-width="1.5"/>
    <circle cx="280" cy="450" r="15"/>
    <circle cx="420" cy="480" r="12"/>
  </g>
  <!-- Decorative corner ornaments -->
  <text x="400" y="80" text-anchor="middle" fill="#C9A962" font-family="serif" font-size="28" letter-spacing="8">& SILK &amp; SOUL &</text>
  <text x="400" y="970" text-anchor="middle" fill="#E8D5A3" font-family="serif" font-size="22" opacity="0.8">Handwoven Elegance</text>
</svg>
