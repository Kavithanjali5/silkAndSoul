<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Shop premium sarees - Banarasi, Kanjeevaram, Silk, Cotton & Designer collections.">
  <title>Shop Sarees | Silk & Soul</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="site-header"></div>

  <div class="page-header">
    <h1>Our Collection</h1>
    <p>Explore handpicked sarees for every occasion</p>
  </div>

  <div class="container">
    <div class="shop-layout">
      <aside class="shop-sidebar">
        <div class="filter-section">
          <h4>Search</h4>
          <input type="search" id="searchInput" placeholder="Search sarees..." style="width:100%;padding:10px 14px;border:1px solid var(--color-border);border-radius:var(--radius);">
        </div>
        <div class="filter-section">
          <h4>Category</h4>
          <div class="filter-chips" id="categoryFilters"></div>
        </div>
        <div class="filter-section">
          <h4>Occasion</h4>
          <div class="filter-chips" id="occasionFilters"></div>
        </div>
        <div class="filter-section">
          <h4>Price Range (₹)</h4>
          <div class="price-inputs">
            <input type="number" id="minPrice" placeholder="Min" min="0">
            <span>—</span>
            <input type="number" id="maxPrice" placeholder="Max" min="0">
          </div>
        </div>
        <button class="btn btn-primary btn-block" onclick="applyFilters()">Apply Filters</button>
      </aside>

      <main class="shop-main">
        <div class="shop-toolbar">
          <div>
            <button class="filter-toggle" onclick="toggleFilters()">☰ Filters</button>
            <span id="resultCount"></span>
          </div>
          <select id="sortSelect" onchange="applyFilters()">
            <option value="featured">Featured</option>
            <option value="newest">Newest</option>
            <option value="price-low">Price: Low to High</option>
            <option value="price-high">Price: High to Low</option>
            <option value="rating">Top Rated</option>
          </select>
        </div>
        <div class="product-grid" id="productGrid"></div>
        <div class="empty-state" id="emptyState" style="display:none;">
          <div class="empty-icon">🔍</div>
          <h2>No sarees found</h2>
          <p>Try adjusting your filters or search term</p>
          <a href="shop.html" class="btn btn-primary">Clear Filters</a>
        </div>
      </main>
    </div>
  </div>

  <div id="site-footer"></div>

  <script src="js/api.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script src="js/tryon.js"></script>
  <script src="js/shop.js"></script>
  <script>
    initPage('shop');
    initShopPage();
  </script>
</body>
</html>
